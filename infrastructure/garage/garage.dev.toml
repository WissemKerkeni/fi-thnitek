# Garage (S3-compatible object store) for LOCAL DEVELOPMENT ONLY. Secrets here are dev placeholders.
# Single node, single replica: production uses its own config and secrets (ADR-215).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "8f0e6a1d2c3b4a59687766554433221100ffeeddccbbaa998877665544332211"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "dev-only-garage-admin-token"
